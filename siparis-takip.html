<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Takip — Bellacone</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#fef2f7; --cream2:#fac8df; --brown:#320d1e;
    --brown2:#f094bc; --accent:#d44f82; --gold:#eaaa40;
    --text:#c0336a; --muted:#8a3860; --white:#fffafc;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}

  nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1.25rem 4rem;display:flex;align-items:center;justify-content:space-between;background:rgba(254,242,247,0.95);backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(212,79,130,0.1);}
  .nav-logo a{display:flex;align-items:center;text-decoration:none;}
  .nav-logo img{height:52px;width:auto;}
  .nav-links{display:flex;gap:2.5rem;align-items:center;}
  .nav-links a{font-size:13px;font-weight:500;color:var(--brown2);text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s;}
  .nav-links a:hover{color:var(--accent);}
  .burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;z-index:1100;}
  .burger span{display:block;width:24px;height:2px;background:var(--brown);border-radius:2px;transition:all 0.3s;}
  .nav-cart-btn{position:relative;background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;color:var(--brown2);transition:color 0.2s;margin-left:0.5rem;}
  .nav-cart-btn:hover{color:var(--accent);}
  .nav-cart-btn svg{width:22px;height:22px;}
  .nav-cart-count{position:absolute;top:-2px;right:-4px;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;opacity:0;transform:scale(0.7);transition:all 0.2s;}
  .nav-cart-count.show{opacity:1;transform:scale(1);}

  .page-wrap{max-width:640px;margin:0 auto;padding:8rem 1.5rem 4rem;}

  .page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,52px);font-weight:300;color:var(--brown);margin-bottom:0.5rem;}
  .page-title em{font-style:italic;color:var(--accent);}
  .page-sub{font-size:14px;color:var(--muted);margin-bottom:2rem;line-height:1.6;}

  /* ARAMA */
  .search-box{background:var(--white);border-radius:20px;padding:1.5rem;box-shadow:0 2px 20px rgba(212,79,130,0.08);margin-bottom:1.5rem;}
  .search-label{font-size:12px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.6rem;display:block;}
  .search-row{display:flex;gap:10px;}
  .search-input{flex:1;border:1.5px solid var(--cream2);border-radius:12px;padding:11px 16px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--brown);background:var(--cream);outline:none;transition:border-color 0.2s;text-transform:uppercase;}
  .search-input::placeholder{text-transform:none;color:var(--muted);opacity:0.6;}
  .search-input:focus{border-color:var(--accent);}
  .search-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all 0.2s;}
  .search-btn:hover{background:var(--brown);}
  .search-hint{font-size:12px;color:var(--muted);margin-top:8px;}

  /* SONUÇ */
  #result{display:none;}
  .result-card{background:var(--white);border-radius:20px;padding:1.5rem;box-shadow:0 2px 20px rgba(212,79,130,0.08);}
  .result-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px;}
  .result-no{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--accent);}
  .result-zaman{font-size:12px;color:var(--muted);}

  /* DURUM ADIMLAR */
  .steps{display:flex;align-items:flex-start;gap:0;margin-bottom:1.5rem;position:relative;}
  .steps::before{content:'';position:absolute;top:18px;left:18px;right:18px;height:2px;background:var(--cream2);z-index:0;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;}
  .step-dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--cream2);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.3s;}
  .step.done .step-dot{background:var(--accent);border-color:var(--accent);color:#fff;}
  .step.active .step-dot{background:var(--white);border-color:var(--accent);box-shadow:0 0 0 4px rgba(212,79,130,0.15);}
  .step-label{font-size:11px;font-weight:500;color:var(--muted);text-align:center;line-height:1.3;}
  .step.done .step-label,.step.active .step-label{color:var(--accent);}

  /* DURUM BADGE */
  .durum-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;}
  .durum-bekliyor{background:rgba(234,170,64,0.15);color:#b8860b;}
  .durum-hazirlaniyor{background:rgba(212,79,130,0.12);color:var(--accent);}
  .durum-yolda{background:rgba(50,13,30,0.08);color:var(--brown);}
  .durum-teslim{background:rgba(80,180,100,0.12);color:#2d7a3a;}

  /* ÜRÜNLER */
  .urun-list{margin-top:1rem;border-top:1px solid var(--cream2);padding-top:1rem;}
  .urun-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(250,200,223,0.4);font-size:14px;}
  .urun-row:last-child{border-bottom:none;}
  .urun-isim{color:var(--brown);flex:1;}
  .urun-fiyat{color:var(--accent);font-weight:600;font-size:15px;}
  .totals{margin-top:1rem;border-top:1.5px solid var(--cream2);padding-top:1rem;}
  .total-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .total-row.main{font-size:17px;font-weight:600;color:var(--brown);margin-top:8px;}

  /* ADRES */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1rem;}
  .info-item{background:var(--cream);border-radius:12px;padding:10px 14px;}
  .info-item-label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .info-item-val{font-size:13px;color:var(--brown);line-height:1.4;}

  /* HATA */
  .not-found{text-align:center;padding:2rem 1rem;}
  .not-found-icon{font-size:48px;margin-bottom:1rem;}
  .not-found p{font-size:14px;color:var(--muted);line-height:1.6;}

  /* MOBİL */
  @media(max-width:900px){
    nav{padding:0.85rem 1.25rem;display:grid !important;grid-template-columns:1fr auto 1fr;align-items:center;}
    .burger{display:flex !important;order:0 !important;justify-self:start;}
    .nav-logo{order:1 !important;justify-self:center !important;}
    .nav-links{display:none !important;}
    .nav-cart-btn{order:2 !important;justify-self:end !important;margin-left:0;}
    .info-grid{grid-template-columns:1fr;}
    .steps::before{left:14px;right:14px;}
    .step-dot{width:28px;height:28px;font-size:13px;}
    .step-label{font-size:10px;}
  }

  /* Sepet paneli CSS */
  .cart-overlay{position:fixed;inset:0;background:rgba(50,13,30,0.35);z-index:2000;opacity:0;pointer-events:none;transition:opacity 0.3s;}
  .cart-overlay.open{opacity:1;pointer-events:all;}
  .cart-panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:95vw;background:var(--white);z-index:2001;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);box-shadow:-4px 0 40px rgba(50,13,30,0.12);}
  .cart-panel.open{transform:translateX(0);}
  .cart-panel-head{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;border-bottom:1px solid var(--cream2);}
  .cart-panel-head h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--brown);}
  .cart-close{background:none;border:none;cursor:pointer;font-size:22px;color:var(--muted);line-height:1;padding:4px;}
  .cart-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;}
  .cart-empty{text-align:center;padding:4rem 1rem;}
  .cart-footer{padding:1.25rem 1.5rem;border-top:1px solid var(--cream2);}
  .cart-siparis-btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.3s;text-align:center;text-decoration:none;}
  .mobile-menu{display:none;position:fixed;inset:0;background:rgba(254,242,247,0.98);backdrop-filter:blur(16px);z-index:1050;flex-direction:column;align-items:center;justify-content:center;gap:2rem;}
  .mobile-menu.open{display:flex !important;}
  .mobile-menu a{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--brown);text-decoration:none;transition:color 0.2s;}
  .mobile-menu a:hover{color:var(--accent);}
  .mob-close{position:absolute;top:2rem;right:2rem;background:none;border:none;font-size:28px;color:var(--brown);cursor:pointer;}
</style>
</head>
<body>

<div class="mobile-menu" id="mobile-menu">
  <button class="mob-close" onclick="closeMobile()">✕</button>
  <a href="index.html" onclick="closeMobile()">Ana Sayfa</a>
  <a href="hakkimizda.html" onclick="closeMobile()">Hakkımızda</a>
  <a href="lezzetler.html" onclick="closeMobile()">Lezzetler</a>
  <a href="iletisim.html" onclick="closeMobile()">İletişim</a>
  <a href="siparis.html" onclick="closeMobile()">Sipariş Ver</a>
</div>

<nav id="navbar">
  <div class="nav-logo">
    <a href="index.html"><img src="bellacone_logo.png" alt="Bellacone" onerror="this.style.display='none'"></a>
  </div>
  <div class="nav-links">
    <a href="index.html">Ana Sayfa</a>
    <a href="hakkimizda.html">Hakkımızda</a>
    <a href="lezzetler.html">Lezzetler</a>
    <a href="iletisim.html">İletişim</a>
    <a href="siparis.html">Sipariş Ver</a>
  </div>
  <button class="burger" id="burger-btn" onclick="toggleMobile()" aria-label="Menü">
    <span></span><span></span><span></span>
  </button>
  <button class="nav-cart-btn" onclick="openCart()" aria-label="Sepet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span class="nav-cart-count" id="nav-cart-count">0</span>
  </button>
</nav>

<div class="page-wrap">
  <div class="page-title">Sipariş <em>Takip</em></div>
  <p class="page-sub">Sipariş numaranızı girerek siparişinizin durumunu öğrenebilirsiniz.</p>

  <div class="search-box">
    <label class="search-label">Sipariş Numarası</label>
    <div class="search-row">
      <input class="search-input" id="no-input" type="text" placeholder="BL-1234 veya 1234" maxlength="7">
      <button class="search-btn" onclick="ara()">Sorgula</button>
    </div>
    <div class="search-hint" id="search-hint">Sipariş onay ekranındaki numarayı girin</div>
  </div>

  <div id="result"></div>
</div>

<!-- Sepet paneli -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cart-panel">
  <div class="cart-panel-head">
    <h3>Sepetim 🛒</h3>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-body" id="cart-body"></div>
  <div class="cart-footer" id="cart-footer" style="display:none;">
    <a href="siparis.html" class="cart-siparis-btn">Siparişe Git →</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const app = initializeApp({
    apiKey: "AIzaSyC18gKyPhFWEWH_244nDLOW0nQE2QgS6kA",
    authDomain: "bellacone-7ee34.firebaseapp.com",
    databaseURL: "https://bellacone-7ee34-default-rtdb.firebaseio.com",
    projectId: "bellacone-7ee34",
    storageBucket: "bellacone-7ee34.firebasestorage.app",
    messagingSenderId: "41187589256",
    appId: "1:41187589256:web:75e6f2f3c3360c9a3bf33d"
  });
  const db = getDatabase(app);

  const DURUMLAR = [
    { key: 'bekliyor',      label: 'Alındı',       emoji: '✓' },
    { key: 'hazirlaniyor', label: 'Hazırlanıyor', emoji: '👨‍🍳' },
    { key: 'yolda',        label: 'Yolda',         emoji: '🛵' },
    { key: 'teslim',       label: 'Teslim Edildi', emoji: '🎉' }
  ];

  function durumIndex(d) {
    return DURUMLAR.findIndex(x => x.key === d);
  }

  function renderSonuc(siparis) {
    const dIdx = durumIndex(siparis.durum || 'bekliyor');

    const stepsHTML = DURUMLAR.map((d, i) => {
      const cls = i < dIdx ? 'done' : i === dIdx ? 'active' : '';
      return \`<div class="step \${cls}">
        <div class="step-dot">\${i <= dIdx ? d.emoji : '○'}</div>
        <div class="step-label">\${d.label}</div>
      </div>\`;
    }).join('');

    const badgeCls = \`durum-\${siparis.durum || 'bekliyor'}\`;
    const badgeLabel = DURUMLAR[dIdx]?.label || siparis.durum;

    const urunlerHTML = (siparis.urunler || []).map(u =>
      \`<div class="urun-row">
        <span class="urun-isim">\${u.isim}\${u.adet > 1 ? ' × ' + u.adet : ''}</span>
        <span class="urun-fiyat">\${u.fiyat} ₺</span>
      </div>\`
    ).join('');

    const zamanStr = siparis.zamanStr || new Date(siparis.zaman).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

    document.getElementById('result').style.display = 'block';
    document.getElementById('result').innerHTML = \`
      <div class="result-card">
        <div class="result-header">
          <div>
            <div class="result-no">#\${siparis.siparisNo}</div>
            <div class="result-zaman">\${zamanStr}</div>
          </div>
          <span class="durum-badge \${badgeCls}">\${DURUMLAR[dIdx]?.emoji} \${badgeLabel}</span>
        </div>

        <div class="steps">\${stepsHTML}</div>

        <div class="urun-list">
          \${urunlerHTML}
        </div>
        <div class="totals">
          <div class="total-row"><span>Ara Toplam</span><span>\${siparis.araToplam} ₺</span></div>
          <div class="total-row"><span>Teslimat</span><span>\${siparis.teslimatUcreti > 0 ? siparis.teslimatUcreti + ' ₺' : 'Ücretsiz'}</span></div>
          <div class="total-row main"><span>Toplam</span><span>\${siparis.toplamFiyat} ₺</span></div>
        </div>
        <div class="info-grid">
          <div class="info-item">
            <div class="info-item-label">Müşteri</div>
            <div class="info-item-val">\${siparis.musteri?.ad || '-'}</div>
          </div>
          <div class="info-item">
            <div class="info-item-label">Ödeme</div>
            <div class="info-item-val">\${siparis.odeme || '-'}</div>
          </div>
          <div class="info-item" style="grid-column:span 2">
            <div class="info-item-label">Adres</div>
            <div class="info-item-val">\${siparis.adres?.adres || '-'}\${siparis.adres?.daire ? ', Daire: ' + siparis.adres.daire : ''}</div>
          </div>
          \${siparis.not ? \`<div class="info-item" style="grid-column:span 2"><div class="info-item-label">Not</div><div class="info-item-val">\${siparis.not}</div></div>\` : ''}
        </div>
      </div>
    \`;
  }

  window.ara = async function() {
    const rawInput = document.getElementById('no-input').value.trim().toUpperCase().replace(/^#/, '');
    const siparisNo = rawInput.startsWith('BL-') ? rawInput : 'BL-' + rawInput;
    const hint = document.getElementById('search-hint');

    if (!rawInput || rawInput.length < 3) {
      hint.style.color = 'var(--accent)';
      hint.textContent = 'Lütfen geçerli bir sipariş numarası girin (örn: BL-1234)';
      return;
    }
    hint.style.color = 'var(--muted)';
    hint.textContent = 'Aranıyor...';
    document.getElementById('result').style.display = 'none';

    try {
      const snap = await get(ref(db, 'online_siparisler'));
      if (!snap.exists()) { showNotFound(); hint.textContent = ''; return; }
      const bulunan = Object.values(snap.val()).find(s => s.siparisNo === siparisNo);
      hint.textContent = '';
      if (!bulunan) { showNotFound(); return; }
      renderSonuc(bulunan);
    } catch(e) {
      hint.style.color = 'var(--accent)';
      hint.textContent = 'Bir hata oluştu, tekrar deneyin.';
      console.error(e);
    }
  };

  function showNotFound() {
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').innerHTML = '<div class="result-card not-found"><div class="not-found-icon">🔍</div><p>Bu numarayla sipariş bulunamadı.<br>Numarayı kontrol edip tekrar deneyin.</p></div>';
  }

  // URL'de ?no= varsa otomatik ara
  const params = new URLSearchParams(location.search);
  const noParam = params.get('no');
  if (noParam) {
    document.getElementById('no-input').value = noParam;
    setTimeout(ara, 400);
  }

  // Nav badge
  (function(){
    function getCart(){try{return JSON.parse(localStorage.getItem('bellacone_sepet')||'[]');}catch(e){return[];}}
    function updateBadge(){var items=getCart();var total=items.reduce(function(s,i){return s+(i.adet||1);},0);var badge=document.getElementById('nav-cart-count');if(!badge)return;badge.textContent=total;if(total>0)badge.classList.add('show');else badge.classList.remove('show');}
    document.addEventListener('DOMContentLoaded',updateBadge);
    window.addEventListener('bellaconeCartUpdate',updateBadge);
  })();

  // Cart panel
  window.openCart = function(){
    var items=[];try{items=JSON.parse(localStorage.getItem('bellacone_sepet')||'[]');}catch(e){}
    var body=document.getElementById('cart-body');
    var footer=document.getElementById('cart-footer');
    if(!items.length){body.innerHTML='<div class="cart-empty" style="text-align:center;padding:3rem 1rem;"><div style="font-size:48px;margin-bottom:1rem;">🛒</div><p style="color:var(--muted);font-size:14px;">Sepetiniz boş</p></div>';if(footer)footer.style.display='none';}
    else{var html='';var total=0;items.forEach(function(item){var f=(item.fiyat||0);total+=f;html+='<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--cream2);align-items:center;"><span style="font-size:24px;">'+( item.emoji||'🍦')+'</span><div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:500;color:var(--brown);">'+item.isim+'</div><div style="font-size:11px;color:var(--muted);">'+item.katIsim+'</div></div><span style="font-size:14px;font-weight:600;color:var(--accent);">'+f+' ₺</span></div>';});body.innerHTML=html;if(footer){footer.style.display='block';}}
    document.getElementById('cart-overlay').classList.add('open');
    document.getElementById('cart-panel').classList.add('open');
    document.body.style.overflow='hidden';
  };
  window.closeCart = function(){document.getElementById('cart-overlay').classList.remove('open');document.getElementById('cart-panel').classList.remove('open');document.body.style.overflow='';};
  window.toggleMobile = function(){var m=document.getElementById('mobile-menu');var b=document.getElementById('burger-btn');m.classList.toggle('open');b.classList.toggle('open');document.body.style.overflow=m.classList.contains('open')?'hidden':'';};
  window.closeMobile = function(){var m=document.getElementById('mobile-menu');var b=document.getElementById('burger-btn');m.classList.remove('open');b.classList.remove('open');document.body.style.overflow='';};

  // Enter tuşu
  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('no-input').addEventListener('keydown', function(e){if(e.key==='Enter')ara();});
  });
</script>
</body>
</html>
