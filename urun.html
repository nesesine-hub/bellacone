<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün — Bellacone</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fef2f7; --cream2: #fac8df; --brown: #320d1e;
    --brown2: #f094bc; --accent: #d44f82; --accent2: #f2c5b0;
    --gold: #eaaa40; --text: #c0336a; --muted: #8a3860; --white: #fffafc;
    --green: #3a9b65; --radius: 16px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; background: rgba(254,242,247,0.95); backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(212,79,130,0.1); }
  .nav-logo img { height: 44px; width: auto; }
  .nav-back { display: flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; background: none; border: none; }
  .nav-back:hover { opacity: 0.75; }
  .nav-back svg { width: 18px; height: 18px; }

  /* LOADING */
  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1rem; }
  .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--cream2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ERROR */
  .error-screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1rem; text-align: center; padding: 2rem; }
  .error-screen .emoji { font-size: 48px; }
  .error-screen h2 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--brown); }
  .error-screen p { color: var(--muted); font-size: 14px; }

  /* SAYFA */
  .urun-page { display: none; padding-top: 70px; max-width: 900px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem; }

  /* GRID */
  .urun-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; padding: 2rem 0 3rem; }

  /* SOL — Fotoğraf */
  .urun-foto-wrap { position: sticky; top: 80px; }
  .urun-foto { width: 100%; aspect-ratio: 1/1; border-radius: 20px; object-fit: cover; background: var(--cream2); display: flex; align-items: center; justify-content: center; font-size: 80px; overflow: hidden; }
  .urun-foto img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
  .urun-kat-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 1rem; padding: 6px 14px; background: var(--cream2); border-radius: 999px; font-size: 12px; color: var(--muted); font-weight: 500; }

  /* SAĞ — Bilgiler */
  .urun-info { display: flex; flex-direction: column; gap: 1.25rem; }
  .urun-baslik { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, 4vw, 42px); font-weight: 300; color: var(--brown); line-height: 1.2; }
  .urun-fiyat { font-size: 28px; font-weight: 600; color: var(--accent); }
  .urun-aciklama { font-size: 15px; color: var(--muted); line-height: 1.7; }
  .urun-detay { font-size: 14px; color: var(--text); line-height: 1.8; padding: 1rem; background: var(--white); border-radius: 12px; border: 1px solid var(--cream2); }

  /* SEÇENEK BÖLÜMLERİ */
  .bolum-wrap { display: flex; flex-direction: column; gap: 1rem; }
  .bolum-card { background: var(--white); border: 1.5px solid var(--cream2); border-radius: 14px; padding: 1rem 1.25rem; }
  .bolum-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
  .bolum-secenekler { display: flex; flex-wrap: wrap; gap: 8px; }
  .secenek-chip { padding: 8px 18px; border: 1.5px solid var(--cream2); border-radius: 999px; font-size: 13px; cursor: pointer; background: var(--cream); color: var(--text); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .secenek-chip:hover { border-color: var(--accent); }
  .secenek-chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }

  /* MİKTAR */
  .miktar-wrap { display: flex; align-items: center; gap: 1rem; }
  .miktar-label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .miktar-ctrl { display: flex; align-items: center; gap: 0; background: var(--white); border: 1.5px solid var(--cream2); border-radius: 999px; overflow: hidden; }
  .miktar-btn { width: 36px; height: 36px; border: none; background: transparent; font-size: 18px; cursor: pointer; color: var(--accent); display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .miktar-btn:hover { background: var(--cream2); }
  .miktar-sayi { width: 36px; text-align: center; font-size: 15px; font-weight: 600; color: var(--brown); }

  /* NOT */
  .not-input { width: 100%; border: 1.5px solid var(--cream2); border-radius: 12px; padding: 10px 14px; font-size: 14px; background: var(--white); color: var(--text); font-family: 'DM Sans', sans-serif; resize: none; outline: none; transition: border-color 0.2s; }
  .not-input:focus { border-color: var(--accent); }

  /* SEPET BUTONU */
  .sepet-btn { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
  .sepet-btn:hover { background: var(--brown); transform: translateY(-1px); }
  .sepet-btn:active { transform: translateY(0); }
  .sepet-btn.added { background: var(--green); }

  /* ALERJEN */
  .alerjen-wrap { display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; background: #fff8e8; border-radius: 10px; border: 1px solid #f0d080; }
  .alerjen-wrap svg { flex-shrink: 0; margin-top: 2px; }
  .alerjen-text { font-size: 12px; color: #7a5c10; line-height: 1.5; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 14px; font-weight: 500; z-index: 9999; transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* MOBİL */
  @media (max-width: 640px) {
    .urun-grid { grid-template-columns: 1fr; gap: 1.5rem; padding: 1.25rem 0 5rem; }
    .urun-foto-wrap { position: static; }
    .urun-foto { aspect-ratio: 4/3; font-size: 60px; }
    .urun-page { padding-left: 1rem; padding-right: 1rem; }
    .sepet-btn { position: fixed; bottom: 0; left: 0; right: 0; border-radius: 0; padding: 18px; z-index: 100; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">
    <a href="index.html"><img src="bellacone_logo.png" alt="Bellacone" onerror="this.style.display='none'"></a>
  </div>
  <button class="nav-back" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Geri Dön
  </button>
</nav>

<!-- LOADING -->
<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <p style="color:var(--muted);font-size:14px;">Yükleniyor...</p>
</div>

<!-- ERROR -->
<div class="error-screen" id="error-screen">
  <div class="emoji">🍦</div>
  <h2>Ürün bulunamadı</h2>
  <p>Bu ürün mevcut değil veya kaldırılmış olabilir.</p>
  <a href="lezzetler.html" style="margin-top:1rem;padding:12px 28px;background:var(--accent);color:#fff;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;">Lezzetlere Dön</a>
</div>

<!-- ÜRÜN SAYFASI -->
<div class="urun-page" id="urun-page">
  <div class="urun-grid">
    <!-- SOL -->
    <div class="urun-foto-wrap">
      <div class="urun-foto" id="urun-foto">
        <span id="urun-emoji">🍦</span>
      </div>
      <div class="urun-kat-badge" id="urun-kat-badge"></div>
    </div>

    <!-- SAĞ -->
    <div class="urun-info">
      <div>
        <h1 class="urun-baslik" id="urun-baslik">—</h1>
        <div class="urun-fiyat" id="urun-fiyat"></div>
      </div>

      <p class="urun-aciklama" id="urun-aciklama" style="display:none;"></p>
      <div class="urun-detay" id="urun-detay" style="display:none;"></div>

      <!-- SEÇENEK BÖLÜMLERİ -->
      <div class="bolum-wrap" id="bolum-wrap"></div>

      <!-- MİKTAR -->
      <div class="miktar-wrap">
        <span class="miktar-label">Adet</span>
        <div class="miktar-ctrl">
          <button class="miktar-btn" onclick="miktar(-1)">−</button>
          <span class="miktar-sayi" id="miktar-sayi">1</span>
          <button class="miktar-btn" onclick="miktar(1)">+</button>
        </div>
      </div>

      <!-- NOT -->
      <textarea class="not-input" id="urun-not" rows="2" placeholder="Özel not ekle... (Örn: az şekerli, ekstra sos)"></textarea>

      <!-- ALERJEN -->
      <div class="alerjen-wrap" id="alerjen-wrap" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a5c10" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="alerjen-text"><strong>Alerjen Bilgisi:</strong> <span id="alerjen-text"></span></div>
      </div>

      <!-- SEPET BUTONU -->
      <button class="sepet-btn" id="sepet-btn" onclick="sepeteEkle()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Sepete Ekle
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyC18gKyPhFWEWH_244nDLOW0nQE2QgS6kA",
    authDomain: "bellacone-7ee34.firebaseapp.com",
    databaseURL: "https://bellacone-7ee34-default-rtdb.firebaseio.com",
    projectId: "bellacone-7ee34",
    storageBucket: "bellacone-7ee34.firebasestorage.app",
    messagingSenderId: "41187589256",
    appId: "1:41187589256:web:75e6f2f3c3360c9a3bf33d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // URL parametrelerini oku
  const params = new URLSearchParams(window.location.search);
  const urunId = params.get('id');
  const katId  = params.get('kat');

  let urunData = null;
  let miktar = 1;
  let secimler = {}; // { bolumAd: secilenDeger }

  async function yukleurun() {
    if (!urunId || !katId) { showError(); return; }

    try {
      // Ürün verisini çek
      const snap = await get(ref(db, `menu/urunler/${katId}/${urunId}`));
      if (!snap.exists()) { showError(); return; }
      urunData = snap.val();

      // Kategori adını çek
      const katSnap = await get(ref(db, `menu/kategoriler/${katId}`));
      const kat = katSnap.val();

      renderUrun(urunData, kat);
    } catch(e) {
      console.error(e);
      showError();
    }
  }

  function renderUrun(u, kat) {
    document.title = `${u.isim} — Bellacone`;

    // Fotoğraf
    if (u.foto) {
      document.getElementById('urun-foto').innerHTML =
        `<img src="${u.foto}" alt="${u.isim}" onerror="this.parentElement.innerHTML='<span style=font-size:80px>${u.emoji||'🍦'}</span>'">`;
    } else {
      document.getElementById('urun-emoji').textContent = u.emoji || '🍦';
    }

    // Kategori badge
    if (kat) {
      document.getElementById('urun-kat-badge').textContent = `${kat.emoji||''} ${kat.isim}`;
    }

    // Bilgiler
    document.getElementById('urun-baslik').textContent = u.isim;
    document.getElementById('urun-fiyat').textContent = u.fiyat ? `${u.fiyat} ₺` : '';

    if (u.aciklama) {
      const el = document.getElementById('urun-aciklama');
      el.textContent = u.aciklama;
      el.style.display = 'block';
    }
    if (u.detay) {
      const el = document.getElementById('urun-detay');
      el.textContent = u.detay;
      el.style.display = 'block';
    }
    if (u.alerjen) {
      document.getElementById('alerjen-text').textContent = u.alerjen;
      document.getElementById('alerjen-wrap').style.display = 'flex';
    }

    // Seçenek bölümleri
    renderBolumler(u.bolumler || []);

    // Göster
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('urun-page').style.display = 'block';
  }

  function renderBolumler(bolumler) {
    const wrap = document.getElementById('bolum-wrap');
    if (!bolumler.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = bolumler.map(b => `
      <div class="bolum-card">
        <div class="bolum-title">${b.ad}</div>
        <div class="bolum-secenekler">
          ${(b.secenekler || []).map(s => `
            <button class="secenek-chip" onclick="secimYap('${b.ad}','${s}',this)">${s}</button>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  window.secimYap = function(bolum, deger, el) {
    secimler[bolum] = deger;
    // Aynı bölümdeki diğer seçeneklerin seçimini kaldır
    el.closest('.bolum-secenekler').querySelectorAll('.secenek-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  };

  // Miktar
  let _miktar = 1;
  window.miktar = function(delta) {
    _miktar = Math.max(1, _miktar + delta);
    document.getElementById('miktar-sayi').textContent = _miktar;
  };

  // Sepete ekle — localStorage'a yaz, siparis.html'de kullanılabilir
  window.sepeteEkle = function() {
    if (!urunData) return;
    const not = document.getElementById('urun-not').value.trim();
    const kalem = {
      id: urunData.id,
      katId,
      isim: urunData.isim,
      emoji: urunData.emoji || '🍦',
      foto: urunData.foto || '',
      fiyat: urunData.fiyat || 0,
      miktar: _miktar,
      secimler,
      not,
      eklenme: Date.now()
    };

    // localStorage'a ekle
    const sepet = JSON.parse(localStorage.getItem('bellacone_sepet') || '[]');
    sepet.push(kalem);
    localStorage.setItem('bellacone_sepet', JSON.stringify(sepet));

    // Buton animasyonu
    const btn = document.getElementById('sepet-btn');
    btn.classList.add('added');
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Sepete Eklendi!`;

    showToast(`${urunData.isim} sepete eklendi 🛍`);

    setTimeout(() => {
      btn.classList.remove('added');
      btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg> Sepete Ekle`;
    }, 2500);
  };

  function showError() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  yukleurun();
</script>
</body>
</html>
